name: Calidad

# El sitio no tiene build, así que lo que hay que vigilar no es que compile:
# es que siga siendo liviano, legible sin JavaScript y accesible. Los tres se
# rompen en silencio —nadie ve un error— y por eso son gate duro, no aviso.
#
# Medido el 2026-09-09 sobre /precios: rendimiento 99, accesibilidad 100,
# buenas prácticas 96, SEO 100. El umbral está en 90 para dejar margen.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Levantar el sitio
        run: |
          npx --yes serve@14 -l 4173 . &
          npx --yes wait-on@7 --timeout 60000 http://localhost:4173/

      - name: Comprobaciones deterministas
        run: ./scripts/verificar.sh http://localhost:4173

      # El chromedriver que baja @axe-core/cli sigue al Chrome ESTABLE, y la
      # imagen del runner va un release atrás. Cuando se desfasan, axe no
      # evalúa nada: muere al abrir el navegador con «This version of
      # ChromeDriver only supports Chrome version 153 / Current browser version
      # is 152». Pasó el 2026-09-09 y tumbó el gate entero, con Lighthouse
      # saltado en cascada.
      #
      # El runner ya trae un chromedriver que SÍ corresponde a su Chrome, y
      # expone su carpeta en $CHROMEWEBDRIVER. Se usa ese y se acabó la carrera
      # de versiones. Si algún día deja de existir, el step falla acá con un
      # mensaje claro en vez de volver a fallar dentro de axe.
      - name: Accesibilidad (axe)
        run: |
          if [ ! -x "${CHROMEWEBDRIVER:-}/chromedriver" ]; then
            echo "::error::No hay chromedriver en \$CHROMEWEBDRIVER (${CHROMEWEBDRIVER:-vacío}). La imagen del runner cambió: hay que revisar cómo se resuelve el driver."
            exit 1
          fi
          "$CHROMEWEBDRIVER/chromedriver" --version
          npx --yes @axe-core/cli@4 --exit \
            --chromedriver-path "$CHROMEWEBDRIVER/chromedriver" \
            http://localhost:4173/ http://localhost:4173/funciones http://localhost:4173/para \
            http://localhost:4173/para/taller-general http://localhost:4173/para/centro-de-servicio http://localhost:4173/para/vehiculos-electricos \
            http://localhost:4173/recursos http://localhost:4173/recursos/recepcion-sin-reclamos http://localhost:4173/recursos/cobrar-la-inspeccion \
            http://localhost:4173/plantillas http://localhost:4173/plantillas/orden-de-trabajo http://localhost:4173/plantillas/inspeccion-12-puntos \
            http://localhost:4173/precios http://localhost:4173/aria http://localhost:4173/contacto \
            http://localhost:4173/privacidad http://localhost:4173/terminos

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14 autorun
